<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Plan and organise social media posts for your App Store apps."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("smc-color-scheme");
          var scheme =
            stored === "Light" || stored === "Dark" || stored === "System" ? stored : "System";
          var dark =
            scheme === "Dark" ||
            (scheme === "System" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
    <title>Social Media Calendar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
